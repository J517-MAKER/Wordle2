<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wordle 2</title>
    <style>
        :root {
            /* Paleta: verde pastel + celeste sobre azul pizarra profundo */
            --bg: #0f1a24;
            --bg-glow: #1b3045;
            --surface: #172736;
            --text: #eaf6ff;
            --muted: #8fa6ba;

            --green: #9ee6be;
            /* verde pastel */
            --green-dark: #12351f;
            /* texto sobre verde */
            --sky: #8fd3f4;
            /* celeste */
            --sky-dark: #0d2b3e;
            /* texto sobre celeste */

            --tile-border: #2f4559;
            --tile-border-filled: #8fd3f4;
            --key: #35506a;
            --absent: #22313f;
            --absent-text: #7f93a6;
            --danger: #f6b5b5;
            --danger-dark: #4a1414;

            --tile: min(62px, calc((100vw - 60px) / 5.4), calc((100vh - 340px) / 6.6));
        }

        @supports (height: 100dvh) {
            :root {
                --tile: min(62px, calc((100vw - 60px) / 5.4), calc((100dvh - 340px) / 6.6));
            }
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
        }

        body {
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: radial-gradient(circle at 50% -10%, var(--bg-glow) 0%, var(--bg) 60%);
        }

        /* ---------- Encabezado ---------- */
        header {
            text-align: center;
            padding: 10px 12px 8px;
            border-bottom: 1px solid rgba(143, 211, 244, 0.18);
        }

        header h1 {
            margin: 0;
            font-size: clamp(1.5rem, 6vw, 2.2rem);
            letter-spacing: 0.15em;
            font-weight: 800;
            background: linear-gradient(90deg, var(--green), var(--sky));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        #plays {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
            font-size: 0.8rem;
            color: var(--muted);
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid var(--sky);
            opacity: 0.6;
        }

        .dot.on {
            background: var(--green);
            border-color: var(--green);
            opacity: 1;
            box-shadow: 0 0 6px rgba(158, 230, 190, 0.6);
        }

        #plays .label {
            margin-left: 4px;
        }

        /* ---------- Tablero ---------- */
        main {
            flex: 1 1 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            min-height: 0;
        }

        .board {
            display: grid;
            gap: 6px;
        }

        .row {
            display: grid;
            grid-template-columns: repeat(5, var(--tile));
            gap: 6px;
        }

        .row.shake {
            animation: shake .45s;
        }

        .tile {
            width: var(--tile);
            height: var(--tile);
            border: 2px solid var(--tile-border);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: calc(var(--tile) * 0.55);
            font-weight: 800;
            user-select: none;
            background: rgba(255, 255, 255, 0.02);
        }

        .tile.filled {
            border-color: var(--tile-border-filled);
            box-shadow: 0 0 8px rgba(143, 211, 244, 0.25);
            animation: pop .1s;
        }

        .tile.flip {
            animation: flip .5s ease forwards;
        }

        .tile.correct {
            background: var(--green);
            border-color: var(--green);
            color: var(--green-dark);
            box-shadow: 0 0 10px rgba(158, 230, 190, 0.35);
        }

        .tile.present {
            background: var(--sky);
            border-color: var(--sky);
            color: var(--sky-dark);
            box-shadow: 0 0 10px rgba(143, 211, 244, 0.3);
        }

        .tile.absent {
            background: var(--absent);
            border-color: var(--absent);
            color: var(--absent-text);
            box-shadow: none;
        }

        @keyframes pop {
            50% {
                transform: scale(1.12);
            }
        }

        @keyframes flip {
            50% {
                transform: rotateX(90deg);
            }
        }

        @keyframes shake {

            10%,
            90% {
                transform: translateX(-2px);
            }

            20%,
            80% {
                transform: translateX(4px);
            }

            30%,
            50%,
            70% {
                transform: translateX(-6px);
            }

            40%,
            60% {
                transform: translateX(6px);
            }
        }

        /* ---------- Teclado ---------- */
        #keyboard {
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
            padding: 6px 6px calc(10px + env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .kb-row {
            display: flex;
            justify-content: center;
            gap: 5px;
        }

        .key {
            flex: 1 1 0;
            max-width: 46px;
            height: 56px;
            border: none;
            border-radius: 8px;
            background: var(--key);
            color: var(--text);
            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            user-select: none;
            padding: 0;
            transition: background-color .2s, color .2s, transform .05s;
        }

        .key.wide {
            flex: 1.6 1 0;
            max-width: 74px;
            font-size: 0.75rem;
        }

        .key.enter {
            background: linear-gradient(135deg, var(--green), var(--sky));
            color: var(--sky-dark);
        }

        .key.correct {
            background: var(--green);
            color: var(--green-dark);
        }

        .key.present {
            background: var(--sky);
            color: var(--sky-dark);
        }

        .key.absent {
            background: var(--absent);
            color: var(--absent-text);
        }

        .key:active {
            transform: scale(0.95);
        }

        /* ---------- Mensajes ---------- */
        #toast {
            position: fixed;
            top: 90px;
            left: 50%;
            transform: translateX(-50%);
            width: max-content;
            max-width: calc(100vw - 32px);
            text-align: center;
            background: var(--sky);
            color: var(--sky-dark);
            font-weight: 700;
            padding: 10px 16px;
            border-radius: 8px;
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s;
            z-index: 50;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
        }

        #toast.show {
            opacity: 1;
        }

        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(5, 12, 18, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 40;
            padding: 16px;
        }

        #overlay.show {
            display: flex;
        }

        .modal {
            background: var(--surface);
            border: 1px solid rgba(143, 211, 244, 0.3);
            border-radius: 16px;
            padding: 24px 22px;
            width: 100%;
            max-width: 340px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }

        .modal h2 {
            margin: 0;
            font-size: 1.6rem;
        }

        .modal p {
            margin: 0;
            color: #cfe3f2;
        }

        #countdown {
            color: var(--sky);
            font-weight: 600;
            min-height: 1.2em;
        }

        .word-pill {
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 800;
            letter-spacing: 0.2em;
            font-size: 1.2rem;
        }

        .word-pill.ok {
            background: var(--green);
            color: var(--green-dark);
        }

        .word-pill.ko {
            background: var(--danger);
            color: var(--danger-dark);
        }

        .modal-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 6px;
        }

        .modal button {
            background: linear-gradient(135deg, var(--green), var(--sky));
            color: var(--sky-dark);
            border: 2px solid transparent;
            border-radius: 10px;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            font-family: inherit;
        }

        .modal button.btn-secondary {
            background: transparent;
            color: var(--sky);
            border-color: var(--sky);
        }

        .modal button.btn-secondary:hover {
            background: rgba(143, 211, 244, 0.12);
        }

        .modal button:disabled {
            background: #2c3d4e;
            color: var(--muted);
            cursor: not-allowed;
        }

        @media (max-width: 400px) {
            .key {
                height: 50px;
                font-size: 0.9rem;
            }

            .kb-row {
                gap: 4px;
            }

            .key.wide {
                font-size: 0.65rem;
            }
        }

        @media (max-height: 620px) {
            .key {
                height: 42px;
            }
        }
    </style>
</head>

                if (raw) store = JSON.parse(raw);
            } catch (e) { /* sin almacenamiento: se usa la memoria */ }

            if (!store || typeof store !== "object") store = { plays: [], current: null };
            const now = Date.now();
            store.plays = Array.isArray(store.plays)
                ? store.plays
                    .map(p => (typeof p === "number" ? { t: p, w: null } : p))
                    .filter(p => p && typeof p.t === "number" && now - p.t < WINDOW_MS)
                : [];
            const cur = store.current;
            if (!cur || !SECRET_WORDS.includes(cur.secret) || !Array.isArray(cur.guesses)) {
                store.current = null;
            }
            return store;
        }

        function saveStore(store) {
            memoryStore = store;
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
            } catch (e) { /* sin almacenamiento: se usa la memoria */ }
        }

        const playsLeft = () =>
            LIMIT_ENABLED ? Math.max(0, MAX_PLAYS - getStore().plays.length) : Infinity;

        // ================== Elección aleatoria de la palabra ==================
        let memoryHistory = [];

        function loadHistory() {
            try {
                const h = JSON.parse(localStorage.getItem(HISTORY_KEY));
                if (Array.isArray(h)) return h;
            } catch (e) { /* sin almacenamiento: se usa la memoria */ }
            return memoryHistory;
        }

        function saveHistory(history) {
            memoryHistory = history;
            try {
                localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
            } catch (e) { /* sin almacenamiento: se usa la memoria */ }
        }

        function randomInt(n) {
            if (window.crypto && crypto.getRandomValues) {
                const buf = new Uint32Array(1);
                crypto.getRandomValues(buf);
                return buf[0] % n;
            }
            return Math.floor(Math.random() * n);
        }

        // Elige una palabra al azar que no haya salido recientemente
        function pickSecret() {
            const history = loadHistory();
            const used = new Set(history);
            if (LIMIT_ENABLED) getStore().plays.forEach(p => used.add(p.w));

            let pool = SECRET_WORDS.filter(w => !used.has(w));
            if (!pool.length) pool = SECRET_WORDS.filter(w => w !== history[history.length - 1]);
            if (!pool.length) pool = SECRET_WORDS;

            const word = pool[randomInt(pool.length)];
            saveHistory([...history, word].slice(-HISTORY_SIZE));
            return word;
        }

        function formatTime(ms) {
            const total = Math.max(0, Math.ceil(ms / 1000));
            const h = String(Math.floor(total / 3600)).padStart(2, "0");
            const m = String(Math.floor((total % 3600) / 60)).padStart(2, "0");
            const s = String(total % 60).padStart(2, "0");
            return `${h}:${m}:${s}`;
        }

        function updatePlaysInfo() {
            playsEl.innerHTML = "";
            if (!LIMIT_ENABLED) {
                playsEl.textContent = "Modo prueba · partidas ilimitadas";
                return;
            }
            const left = playsLeft();
            for (let i = 0; i < MAX_PLAYS; i++) {
                const dot = document.createElement("span");
                dot.className = "dot" + (i < left ? " on" : "");
                playsEl.appendChild(dot);
            }
            const label = document.createElement("span");
            label.className = "label";
            label.textContent = left === 1 ? "1 partida disponible" : `${left} partidas disponibles`;
            playsEl.appendChild(label);
        }

        // Actualiza el botón del cuadro final: habilitado o con cuenta regresiva
        function refreshOverlayButton() {
            clearInterval(countdownTimer);
            if (!LIMIT_ENABLED) {
                countdownEl.textContent = "La próxima partida tendrá otra palabra.";
                restartBtn.disabled = false;
                restartBtn.textContent = "Jugar de nuevo";
                return;
            }
            const tick = () => {
                const store = getStore();
                if (store.plays.length < MAX_PLAYS) {
                    clearInterval(countdownTimer);
                    const left = MAX_PLAYS - store.plays.length;
                    countdownEl.textContent = left === 1
                        ? "Te queda 1 partida disponible, con otra palabra."
                        : `Te quedan ${left} partidas disponibles.`;
                    restartBtn.disabled = false;
                    restartBtn.textContent = "Jugar de nuevo";
                    updatePlaysInfo();
                    return;
                }
                const ms = Math.min(...store.plays.map(p => p.t)) + WINDOW_MS - Date.now();
                countdownEl.textContent = `Próxima partida en ${formatTime(ms)}`;
                restartBtn.disabled = true;
                restartBtn.textContent = "Vuelve más tarde";
            };
            tick();
            countdownTimer = setInterval(tick, 1000);
        }

        function showLimit() {
            gameOver = true;
            document.getElementById("result-title").textContent = "⏳ Límite alcanzado";
            document.getElementById("result-text").textContent =
                `Ya jugaste tus ${MAX_PLAYS} partidas de las últimas 24 horas.`;
            pillEl.style.display = "none";
            refreshOverlayButton();
            overlayEl.classList.add("show");
        }

        // ================== Utilidades ==================
        let toastTimer;
        function showToast(msg, ms = 1500) {
            toastEl.textContent = msg;
            toastEl.classList.add("show");
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toastEl.classList.remove("show"), ms);
        }

        // Evalúa la palabra gestionando correctamente las letras repetidas
        function evaluate(guess, target) {
            const result = Array(WORD_LENGTH).fill("absent");
            const remaining = {};
            for (let i = 0; i < WORD_LENGTH; i++) {
                if (guess[i] === target[i]) result[i] = "correct";
                else remaining[target[i]] = (remaining[target[i]] || 0) + 1;
            }
            for (let i = 0; i < WORD_LENGTH; i++) {
                if (result[i] !== "correct" && remaining[guess[i]] > 0) {
                    result[i] = "present";
                    remaining[guess[i]]--;
                }
            }
            return result;
        }

        // ================== Interfaz ==================
        function buildBoard() {
            boardEl.innerHTML = "";
            for (let r = 0; r < MAX_ATTEMPTS; r++) {
                const row = document.createElement("div");
                row.className = "row";
                row.id = `r-${r}`;
                for (let c = 0; c < WORD_LENGTH; c++) {
                    const t = document.createElement("div");
                    t.className = "tile";
                    t.id = `t-${r}-${c}`;
                    row.appendChild(t);
                }
                boardEl.appendChild(row);
            }
        }

        function buildKeyboard() {
            keyboardEl.innerHTML = "";
            KEY_ROWS.forEach(row => {
                const rowDiv = document.createElement("div");
                rowDiv.className = "kb-row";
                row.forEach(k => {
                    const btn = document.createElement("button");
                    btn.className = "key";
                    if (k === "ENTER" || k === "BORRAR") {
                        btn.classList.add("wide");
                        if (k === "ENTER") {
                            btn.classList.add("enter");
                            btn.textContent = "ENVIAR";
                        } else {
                            btn.textContent = "⌫";
                        }
                    } else {
                        btn.textContent = k;
                        btn.id = `key-${k}`;
                    }
                    btn.addEventListener("click", e => {
                        e.currentTarget.blur();
                        handleKey(k);
                    });
                    rowDiv.appendChild(btn);
                });
                keyboardEl.appendChild(rowDiv);
            });
        }

        // ================== Juego ==================
        function resetBoard() {
            currentRow = 0;
            currentGuess = "";
            gameOver = false;
            busy = false;
            started = false;
            keyStates = {};
            buildBoard();
            buildKeyboard();
        }

        function newGame() {
            if (playsLeft() <= 0) {
                showLimit();
                return;
            }
            clearInterval(countdownTimer);
            overlayEl.classList.remove("show");
            secret = pickSecret();
            resetBoard();
            updatePlaysInfo();
        }

        // Al cargar: retoma la partida en curso, muestra el límite o empieza una nueva
        function init() {
            if (!LIMIT_ENABLED) {
                // Modo prueba: se borran las partidas guardadas de pruebas anteriores
                try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* sin almacenamiento */ }
                newGame();
                return;
            }

            const store = getStore();
            saveStore(store);

            if (store.current) {
                resetBoard();
                secret = store.current.secret;
                started = true;
                const guesses = store.current.guesses
                    .filter(g => typeof g === "string" && g.length === WORD_LENGTH)
                    .slice(0, MAX_ATTEMPTS);

                guesses.forEach(g => {
                    const result = evaluate(g, secret);
                    for (let c = 0; c < WORD_LENGTH; c++) {
                        const t = tile(currentRow, c);
                        t.textContent = g[c];
                        t.classList.add(result[c]);
                    }
                    updateKeyboard(g, result);
                    currentRow++;
                });
                updatePlaysInfo();

                if (guesses[guesses.length - 1] === secret) endGame(true);
                else if (currentRow >= MAX_ATTEMPTS) endGame(false);
            } else if (store.plays.length >= MAX_PLAYS) {
                resetBoard();
                updatePlaysInfo();
                showLimit();
            } else {
                newGame();
            }
        }

        function handleKey(key) {
            if (gameOver || busy) return;
            if (key === "ENTER") {
                submitGuess();
            } else if (key === "BORRAR") {
                currentGuess = currentGuess.slice(0, -1);
                renderRow();
            } else if (/^[A-ZÑ]$/.test(key) && currentGuess.length < WORD_LENGTH) {
                currentGuess += key;
                renderRow();
            }
        }

        function renderRow() {
            for (let c = 0; c < WORD_LENGTH; c++) {
                const t = tile(currentRow, c);
                const letter = currentGuess[c] || "";
                if (t.textContent !== letter) {
                    t.textContent = letter;
                    t.classList.toggle("filled", !!letter);
                }
            }
        }

        function shakeRow() {
            const row = document.getElementById(`r-${currentRow}`);
            row.classList.remove("shake");
            void row.offsetWidth;
            row.classList.add("shake");
        }

        function submitGuess() {
            if (currentGuess.length < WORD_LENGTH) {
                shakeRow();
                showToast("Faltan letras");
                return;
            }
            if (!VALID_WORDS.has(currentGuess)) {
                shakeRow();
                showToast("No está en la lista de palabras");
                return;
            }

            // Con límite activo, la partida cuenta desde la primera palabra enviada
            if (LIMIT_ENABLED) {
                const store = getStore();
                if (!started) {
                    if (store.plays.length >= MAX_PLAYS) {
                        showLimit();
                        return;
                    }
                    store.plays.push({ t: Date.now(), w: secret });
                    store.current = { secret, guesses: [] };
                    started = true;
                }
                if (!store.current) store.current = { secret, guesses: [] };
                store.current.guesses.push(currentGuess);
                saveStore(store);
                updatePlaysInfo();
            }

            busy = true;
            const guess = currentGuess;
            const row = currentRow;
            const result = evaluate(guess, secret);

            for (let c = 0; c < WORD_LENGTH; c++) {
                const t = tile(row, c);
                setTimeout(() => {
                    t.classList.add("flip");
                    setTimeout(() => t.classList.add(result[c]), 250);
                }, c * FLIP_DELAY);
            }

            setTimeout(() => {
                updateKeyboard(guess, result);
                currentRow++;
                currentGuess = "";
                busy = false;

                if (guess === secret) endGame(true);
                else if (currentRow >= MAX_ATTEMPTS) endGame(false);
            }, FLIP_DELAY * (WORD_LENGTH - 1) + 550);
        }

        function updateKeyboard(guess, result) {
            for (let i = 0; i < WORD_LENGTH; i++) {
                const letter = guess[i];
                const prev = keyStates[letter];
                if (!prev || STATE_RANK[result[i]] > STATE_RANK[prev]) {
                    keyStates[letter] = result[i];
                    const keyEl = document.getElementById(`key-${letter}`);
                    if (keyEl) {
                        keyEl.classList.remove("correct", "present", "absent");
                        keyEl.classList.add(result[i]);
                    }
                }
            }
        }

        function endGame(won) {
            gameOver = true;
            if (LIMIT_ENABLED) {
                const store = getStore();
                store.current = null;
                saveStore(store);
            }
            updatePlaysInfo();

            document.getElementById("result-title").textContent = won ? "🎉 ¡Ganaste!" : "😢 Perdiste";
            document.getElementById("result-text").textContent = won
                ? `Lo adivinaste en ${currentRow} de ${MAX_ATTEMPTS} intentos.`
                : "Se acabaron los intentos. La palabra era:";
            pillEl.textContent = secret;
            pillEl.className = "word-pill " + (won ? "ok" : "ko");
            pillEl.style.display = "";
            refreshOverlayButton();
            setTimeout(() => overlayEl.classList.add("show"), 400);
        }

        // Intenta cerrar la pestaña. Los navegadores solo lo permiten en algunos casos
        // (por ejemplo, si la pestaña se abrió desde un enlace o con window.open).
        function closeTab() {
            window.close();
            // Si la pestaña sigue abierta, el navegador bloqueó el cierre
            setTimeout(() => {
                clearInterval(countdownTimer);
                overlayEl.classList.remove("show");
                showToast("Tu navegador no permite cerrarla automáticamente. Ciérrala manualmente.", 4000);
            }, 300);
        }

        // ================== Teclado físico ==================
        document.addEventListener("keydown", e => {
            if (e.ctrlKey || e.metaKey || e.altKey) return;
            if (overlayEl.classList.contains("show")) {
                if (e.key === "Enter") {
                    e.preventDefault();
                    if (!restartBtn.disabled) newGame();
                }
                return;
            }
            if (e.key === "Enter") { e.preventDefault(); handleKey("ENTER"); }
            else if (e.key === "Backspace") { e.preventDefault(); handleKey("BORRAR"); }
            else if (e.key.length === 1) {
                const upper = e.key.toUpperCase();
                const letter = ACCENTS[upper] || upper;
                if (/^[A-ZÑ]$/.test(letter)) handleKey(letter);
            }
        });

        restartBtn.addEventListener("click", () => {
            if (!restartBtn.disabled) newGame();
        });
        closeTabBtn.addEventListener("click", closeTab);

        init();
    </script>
</body>
